name: Deploy Philosophia to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Las comprobaciones académicas y los smoke tests de cada
      # sistema 2D se ejecutan en quality.yml (PR/manual).
      # Evita que tests de contenidos ajenos bloqueen GitHub Pages.
      - name: Build
        env:
          VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: npm run build

      - name: Verify built artifact
        run: test -s dist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify public Kołakowski route
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tests/kolakowski-production-smoke.mjs "${PAGE_URL}#/tareas/ontologia-ii/kolakowski-positivismo"
