name: Deploy Philosophia to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate 2D invariants
        run: npm run test:2d

      - name: Validate editorial pilot
        run: npm run test:editorial

      - name: Validate library catalogue
        run: node --test tests/library-catalog.test.mjs tests/library-navigation.test.mjs tests/library-timeline.test.mjs tests/library-academic-connections.test.mjs tests/library-governance.test.mjs tests/library-apa.test.mjs tests/library-graph.test.mjs

      - name: Lint library source
        run: npx eslint src/data/libraryCatalog.js src/data/libraryCatalogUtils.js src/pages/PhilosophiaLibrary.jsx src/data/libraryTimelines.js src/data/libraryAcademicConnections.js src/data/libraryApa.js src/data/libraryApaMetadata.js src/data/libraryGraph.js src/pages/LibraryCartography.jsx

      - name: Lint Lukács ontology system
        run: npx eslint src/data/lukacsOntologySystem.js src/components/lukacs/LukacsOntologyNode.jsx src/pages/LukacsOntologySystem.jsx tests/lukacs-ontology-system.test.mjs tests/lukacs-ontology-browser-smoke.mjs

      - name: Lint Methods 19 October system
        run: npx eslint src/pages/MethodsClass19Oct.jsx tests/methods-class-19oct.test.mjs

      - name: Build
        env:
          VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: npm run build

      - name: Validate Glock in headless browser (desktop, phone and iPad)
        run: node tests/glock-browser-smoke.mjs

      - name: Validate library in headless browser (phone and iPad)
        run: node tests/library-browser-smoke.mjs

      - name: Validate Lukács ontology in headless browser (phone and iPad)
        run: node tests/lukacs-ontology-browser-smoke.mjs

      - name: Validate Hegel teacher folios in Chromium (tablet)
        run: node tests/hegel-teacher-browser-smoke.mjs

      - name: Validate Café del Agua in Chromium (phone and tablet)
        run: node tests/cafe-agua-browser-smoke.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
