name: Library integrity checks

on:
  push:
    branches:
      - feat/biblioteca-gobernanza-enlaces-20261015
  pull_request:
    branches: [main]
    paths:
      - 'src/data/library*.js'
      - 'src/pages/PhilosophiaLibrary.*'
      - 'tests/library-*.mjs'
      - '.github/workflows/library-checks.yml'
      - '.github/workflows/deploy.yml'
      - 'docs/library-governance.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Test biblioteca, vínculos y gobernanza
        run: node --test tests/library-catalog.test.mjs tests/library-navigation.test.mjs tests/library-timeline.test.mjs tests/library-academic-connections.test.mjs tests/library-governance.test.mjs tests/library-apa.test.mjs
      - name: Lint del código de biblioteca
        run: npx eslint src/data/libraryCatalog.js src/data/libraryCatalogUtils.js src/data/libraryTimelines.js src/data/libraryAcademicConnections.js src/data/libraryApa.js src/data/libraryApaMetadata.js src/pages/PhilosophiaLibrary.jsx
      - name: Build
        run: npm run build
      - name: 'Navegación en Chrome: teléfono y tableta'
        run: node tests/library-browser-smoke.mjs
