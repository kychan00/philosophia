name: Bootstrap Editorial UdeG snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/sync-editorial-udg.py'
      - 'src/data/editorialUdgCatalog.generated.js'
      - '.github/workflows/editorial-udg-bootstrap.yml'

permissions:
  contents: write

jobs:
  refresh-snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/biblioteca-editorial-udg-20261107'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Capturar catálogo oficial
        run: python3 scripts/sync-editorial-udg.py --date 2026-11-07
      - name: Verificar tamaño e integridad básica
        run: node --test tests/editorial-udg-catalog.test.mjs
      - name: Commit de la instantánea en la rama del PR
        run: |
          if git diff --quiet -- src/data/editorialUdgCatalog.generated.js; then
            echo "Sin cambios en la instantánea"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/data/editorialUdgCatalog.generated.js
          git commit -m "data: capturar catálogo Editorial UdeG"
          git push origin "HEAD:${{ github.head_ref }}"
