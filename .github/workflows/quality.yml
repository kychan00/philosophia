name: Validate PHILOSOPHIA (PR and manual)

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate 2D invariants
        run: npm run test:2d

      - name: Validate editorial pilot
        run: npm run test:editorial

      - name: Validate library catalogue
        run: node --test tests/library-catalog.test.mjs tests/library-navigation.test.mjs tests/library-timeline.test.mjs tests/library-academic-connections.test.mjs tests/library-governance.test.mjs tests/library-apa.test.mjs tests/library-graph.test.mjs tests/library-class-references.test.mjs

      - name: Validate Nava technoscience 2D
        run: node --test tests/nava-technoscience.test.mjs

      - name: Lint library source
        run: npx eslint src/data/libraryCatalog.js src/data/libraryCatalogUtils.js src/pages/PhilosophiaLibrary.jsx src/data/libraryTimelines.js src/data/libraryClassReferences.js src/data/libraryReferenceTimelines.js src/data/classReferences/*.js src/data/libraryAcademicConnections.js src/data/libraryApa.js src/data/libraryApaMetadata.js src/data/libraryGraph.js src/pages/LibraryCartography.jsx

      - name: Lint Lukács ontology system
        run: npx eslint src/data/lukacsOntologySystem.js src/components/lukacs/LukacsOntologyNode.jsx src/pages/LukacsOntologySystem.jsx tests/lukacs-ontology-system.test.mjs tests/lukacs-ontology-browser-smoke.mjs

      - name: Lint Methods 19 October system
        run: npx eslint src/pages/MethodsClass19Oct.jsx tests/methods-class-19oct.test.mjs

      - name: Lint Methods 21 October system
        run: npx eslint src/pages/MethodsClass21Oct.jsx tests/methods-class-21oct.test.mjs tests/methods-class21-browser-smoke.mjs

      - name: Lint Analytic Philosophy 19 October class
        run: npx eslint src/pages/AnalyticClass19Oct.jsx src/data/glockClass19Oct.js tests/analytic-class-19oct.test.mjs tests/analytic-class19-browser-smoke.mjs

      - name: Lint Nava 2D and source model
        run: npx eslint src/pages/NavaTechnoscienceSystem.jsx src/data/navaTechnoscience2026.js tests/nava-technoscience.test.mjs tests/nava-technoscience-browser-smoke.mjs

      - name: Lint Marx Bloch Feuerbach independent atlas
        run: npx eslint src/data/marxHegelThreeReadings.js src/pages/MarxHegelThreeReadingsSystem.jsx tests/marx-hegel-three-readings-system.test.mjs tests/marx-hegel-three-readings-browser-smoke.mjs

      - name: Lint Hartmann functional browser test
        run: npx eslint tests/hartmann-chapter1-browser-smoke.mjs

      - name: Lint Freud multichapter reader and smoke
        run: npx eslint src/data/freudMalestarBook.js src/pages/FreudMalestarCapituloI.jsx tests/freud-capitulo-i.test.mjs tests/freud-capitulo-i-browser-smoke.mjs

      - name: Build
        env:
          VITE_ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
        run: npm run build

      - name: Validate Methods 21 October in Chromium (desktop, iPad and phone)
        run: node tests/methods-class21-browser-smoke.mjs

      - name: Validate Glock in headless browser (desktop, phone and iPad)
        run: node tests/glock-browser-smoke.mjs

      - name: Validate Analytic Philosophy 19 October class in Chromium
        run: node tests/analytic-class19-browser-smoke.mjs

      - name: Validate Nava 2D in Chromium (desktop, phone and iPad)
        run: node tests/nava-technoscience-browser-smoke.mjs

      - name: Validate library in headless browser (phone and iPad)
        run: node tests/library-browser-smoke.mjs

      - name: Validate Lukács ontology in headless browser (phone and iPad)
        run: node tests/lukacs-ontology-browser-smoke.mjs

      - name: Validate Hegel teacher folios in Chromium (tablet)
        run: node tests/hegel-teacher-browser-smoke.mjs

      - name: Validate Marx Bloch Feuerbach 2D in Chromium (desktop, phone, iPad)
        run: node tests/marx-hegel-three-readings-browser-smoke.mjs

      - name: Validate Hartmann chapter I 2D in Chromium (desktop, tablet and phone)
        run: node tests/hartmann-chapter1-browser-smoke.mjs

      - name: Validate Freud multichapter reader in Chromium
        run: node tests/freud-capitulo-i-browser-smoke.mjs

      - name: Validate Café del Agua in Chromium (phone and tablet)
        run: node tests/cafe-agua-browser-smoke.mjs
