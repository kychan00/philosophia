name: Validate Mercadotecnia 2D macOS

on:
  push:
    branches:
      - feat/cafe-mercadotecnia-system-2d

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx vite build
