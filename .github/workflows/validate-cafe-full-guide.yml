name: Validate Mercadotecnia full guide

on:
  push:
    branches:
      - feat/cafe-mercadotecnia-guide-all-nodes

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx vite build
