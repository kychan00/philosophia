<script>
const slides=[
{folio:"PORTADA",title:"DIALÉCTICA",subtitle:"De Sócrates y Platón a Hegel y Marx",kind:"cover",body:`<div class="hero-title"><p class="kicker">PRESENTACIÓN ACADÉMICA · OCTUBRE 2026</p><h1>DIALÉCTICA <em>De Sócrates y Platón a Hegel y Marx</em></h1><div class="triptych"><article><span class="bigword">01</span><p>PREGUNTAR</p></article><article><span class="bigword">02</span><p>DESARROLLAR</p></article><article><span class="bigword">03</span><p>TRANSFORMAR</p></article></div></div>`,source:"Basada en el informe de investigación adjunto · 23 páginas"},
{folio:"PUNTO DE PARTIDA",title:"Una palabra. Tres proyectos filosóficos.",kind:"triptych",body:`<p class="kicker">LA TESIS QUE ORGANIZA TODA LA EXPOSICIÓN</p><h2>Una palabra. Tres proyectos filosóficos.</h2><p class="lead">La continuidad histórica es real; la identidad metodológica, no.</p><div class="triptych"><article><h3>Sócrates / Platón</h3><p>Examinar creencias y orientar el pensamiento hacia principios.</p></article><article><h3>Hegel</h3><p>Comprender el movimiento interno de las determinaciones.</p></article><article><h3>Marx</h3><p>Analizar formas sociales e intervenir en su transformación.</p></article></div><div class="callout">NO EXISTE UNA “RECETA DIALÉCTICA” UNIVERSAL</div>`,source:"Informe, pp. 1–2"},
{folio:"GENEALOGÍA",title:"Una genealogía con rupturas",kind:"timeline",body:`<p class="kicker">HISTORIA CONCEPTUAL</p><h2>Una genealogía con rupturas</h2><p class="lead">Las flechas indican influencia y reelaboración, no una fórmula idéntica.</p><div class="timeline"><div><b>399<br>a. C.</b><span>Sócrates</span><small>Examen y refutación</small></div><div><b>s. IV<br>a. C.</b><span>Platón</span><small>Hipótesis y división</small></div><div><b>1781</b><span>Kant</span><small>Antinomias</small></div><div><b>1807<br>1830</b><span>Hegel</span><small>Negación determinada</small></div><div><b>1845<br>1873</b><span>Marx</span><small>Crítica social</small></div></div><div class="callout">Transformaciones del objeto: creencias → categorías → relaciones sociales</div>`,source:"Informe, pp. 17–18"},
{folio:"COMPARACIÓN INICIAL",title:"¿Dónde ocurre la dialéctica?",kind:"numbered",body:`<p class="kicker">TRES PREGUNTAS RECTORAS</p><h2>¿Dónde ocurre la dialéctica?</h2><div class="numbered"><div class="row"><div class="num">1</div><div><strong>En lo que decimos</strong><p>creencias · definiciones · argumentos</p></div></div><div class="row"><div class="num">2</div><div><strong>En lo que pensamos y comprendemos</strong><p>determinaciones · conciencia · instituciones</p></div></div><div class="row"><div class="num">3</div><div><strong>En lo que socialmente hacemos</strong><p>trabajo · valor · capital · clases</p></div></div></div>`,source:"Informe, pp. 1–2"},
{folio:"01 / SÓCRATES Y PLATÓN",title:"Sócrates y Platón",kind:"section ancient",body:`<div class="section ancient"><div><div class="index">ESTUDIO COMPARATIVO / 01</div><h2>Sócrates y Platón</h2><p>Del diálogo que refuta al conocimiento que examina sus propios principios.</p><div class="small">Antigüedad</div></div></div>`},
{folio:"SÓCRATES / MÉTODO",title:"La filosofía como examen de creencias",kind:"flow5",body:`<p class="kicker">ELÉNCHOS</p><h2>La filosofía como examen de creencias</h2><p class="lead">Una respuesta se pone a prueba con compromisos que el interlocutor acepta.</p><div class="flow5"><article><b>01</b><h3>Pregunta</h3><p>¿Qué es X?</p></article><article><b>02</b><h3>Definición</h3><p>El interlocutor propone P.</p></article><article><b>03</b><h3>Examen</h3><p>Se admiten Q, R, S.</p></article><article><b>04</b><h3>Tensión</h3><p>P no concuerda con Q/R.</p></article><article><b>05</b><h3>Aporía</h3><p>Revisar lo creído.</p></article></div><div class="callout">Importante: mostrar inconsistencia no prueba automáticamente cuál premisa es falsa.</div>`,source:"Platón, Eutifrón 5d–6e; informe, pp. 3–4"},
{folio:"SÓCRATES / EJEMPLO",title:"¿Qué es la piedad?",kind:"example",body:`<p class="kicker">EJEMPLO RAZONADO</p><h2>¿Qué es la piedad?</h2><p class="lead">El diálogo exige una definición, no únicamente una enumeración de ejemplos.</p><div class="flow4" style="grid-template-columns:repeat(3,1fr)"><article><b>1</b><h3>Respuesta inicial</h3><p>Eutifrón propone una manera de identificar lo piadoso a partir de una acción.</p></article><article><b>2</b><h3>Pregunta socrática</h3><p>¿Eso muestra un caso de piedad o explica qué hace piadosas a las acciones?</p></article><article><b>3</b><h3>Resultado</h3><p>Las definiciones se revisan y aparecen dificultades nuevas: aporía.</p></article></div><div class="callout">La dificultad es productiva: abandonar la falsa certeza abre la investigación.</div>`,source:"Platón, Eutifrón 5d–6e; 9e–11b"},
{folio:"SÓCRATES / APORÍA",title:"No saber puede ser un progreso",kind:"beforeafter",body:`<p class="kicker">UNA PARADOJA PEDAGÓGICA</p><h2>No saber puede ser un progreso</h2><p class="lead">La aporía no equivale a una derrota intelectual.</p><div class="beforeafter"><div class="state"><b>ANTES</b><p>“Sé qué significa justicia”.</p></div><div class="arrow">→</div><div class="state"><b>DESPUÉS</b><p>“Mis respuestas no son coherentes; debo investigar”.</p></div></div><div class="callout">Freno metodológico: un diálogo puede partir de premisas compartidas culturalmente sesgadas.</div>`,source:"Informe, pp. 3–5"},
{folio:"PLATÓN / MÉTODOS",title:"Cuatro prácticas dialécticas",kind:"cards4",body:`<p class="kicker">NO HAY UN PLATÓN METODOLÓGICAMENTE PLANO</p><h2>Cuatro prácticas dialécticas</h2><div class="cards4"><article><b>01</b><h3>Elénchos</h3><p>Examinar y refutar afirmaciones · <em>Eutifrón</em>.</p></article><article><b>02</b><h3>Hipótesis</h3><p>Investigar suponiendo condiciones · <em>Menón</em> 86e–89c.</p></article><article><b>03</b><h3>Ascenso</h3><p>Interrogar presupuestos y principios · <em>República</em> VI–VII.</p></article><article><b>04</b><h3>Colección / división</h3><p>Reunir géneros y distinguir especies · <em>Fedro</em> 265d–266b.</p></article></div>`,source:"Informe, pp. 2–5"},
{folio:"PLATÓN / REPÚBLICA",title:"De hipótesis a fundamentos",kind:"pyramid",body:`<p class="kicker">LA DIALÉCTICA Y EL PRINCIPIO</p><h2>De hipótesis a fundamentos</h2><p class="lead">La dialéctica examina lo que otros saberes presuponen.</p><div class="pyramid"><div><strong>Hipótesis iniciales</strong><span class="muted"> · Puntos de partida que no deben absolutizarse</span></div><div><strong>Examen de fundamentos</strong><span class="muted"> · ¿Por qué admitir este supuesto?</span></div><div><strong>Búsqueda de un principio</strong><span class="muted"> · Horizonte de justificación no hipotética</span></div></div><div class="callout">No se trata de “ganar” una discusión, sino de justificar el saber.</div>`,source:"República 509d–511e; 531d–535a"},
{folio:"PLATÓN / FEDRO Y SOFISTA",title:"Pensar también es distinguir bien",kind:"tree",body:`<p class="kicker">COLECCIÓN Y DIVISIÓN</p><h2>Pensar también es distinguir bien</h2><p class="lead">Del conjunto de casos al género; del género a articulaciones relevantes.</p><div class="diagram-tree"><div class="root">GÉNERO COMÚN</div><div class="branches"><div>Diferencia relevante A</div><div>Diferencia relevante B</div></div></div><div class="callout">La distinción entre géneros no es idéntica a la negación determinada hegeliana.</div>`,source:"Fedro 265d–266b; Sofista 253b–e"},
{folio:"02 / HEGEL",title:"Hegel",kind:"section hegel",body:`<div class="section hegel"><div><div class="index">ESTUDIO COMPARATIVO / 02</div><h2>Hegel</h2><p>La crítica deja de depender del interlocutor: las determinaciones exhiben sus propios límites.</p><div class="small">Idealismo alemán</div></div></div>`},
{folio:"HEGEL / MÉTODO",title:"Entendimiento, negatividad, especulación",kind:"triad",body:`<p class="kicker">LOS TRES LADOS DE LO LÓGICO</p><h2>Entendimiento, negatividad, especulación</h2><p class="lead">Más preciso que la fórmula “tesis–antítesis–síntesis”.</p><div class="triad"><div><strong>01 · Entendimiento</strong><p>Fija determinaciones.</p></div><div><strong>02 · Momento dialéctico</strong><p>Revela sus límites.</p></div><div><strong>03 · Momento especulativo</strong><p>Piensa la unidad determinada.</p></div></div><div class="callout">No es una secuencia mecánica de tres casillas que pueda imponerse a todo objeto.</div>`,source:"Enciclopedia, §§79–82"},
{folio:"HEGEL / CIENCIA DE LA LÓGICA",title:"Ser · Nada · Devenir",kind:"cycle",body:`<p class="kicker">UN EJEMPLO CÉLEBRE</p><h2>Ser · Nada · Devenir</h2><p class="lead">No son tres objetos empíricos que después se mezclan.</p><div class="cycle"><div class="box"><h3>SER PURO</h3></div><div class="mid">↔</div><div class="box"><h3>NADA PURA</h3></div><div class="box bottom"><h3>DEVENIR</h3><p>Unidad dinámica de las dos determinaciones abstractas.</p></div></div>`,source:"Ciencia de la lógica, Doctrina del ser: Ser–Nada–Devenir"},
{folio:"HEGEL / NEGACIÓN DETERMINADA",title:"El fracaso produce un resultado con contenido",kind:"stack",body:`<p class="kicker">LA NEGACIÓN NO ES PURO VACÍO</p><h2>El fracaso produce un resultado con contenido</h2><div class="stack"><div><b>A</b><span>Una forma de conciencia afirma un criterio.</span></div><div><b>LÍMITE</b><span>La experiencia revela insuficiencia interna.</span></div><div><b>NEGACIÓN</b><span>La crítica muestra qué falla exactamente.</span></div><div><b>B</b><span><strong>Surge una determinación más adecuada.</strong></span></div></div>`,source:"Fenomenología del espíritu, Introducción; informe, pp. 7–8"},
{folio:"HEGEL / AUFHEBUNG",title:"Aufhebung = superar conservando",kind:"triad",body:`<p class="kicker">EL NÚCLEO DIFÍCIL DE TRADUCIR</p><h2><em>Aufhebung</em> = superar conservando</h2><p class="lead">Tres sentidos, una operación filosófica compleja.</p><div class="triad"><div><strong>CANCELAR</strong><p>La forma insuficiente deja de valer como absoluta.</p></div><div><strong>CONSERVAR</strong><p>Lo verdadero no desaparece sin resto.</p></div><div><strong>ELEVAR</strong><p>El contenido reaparece en una figura más rica.</p></div></div>`,source:"Informe, pp. 7–8; Enciclopedia §§79–82"},
{folio:"HEGEL / FENOMENOLOGÍA",title:"Reconocimiento y dependencia",kind:"two",body:`<p class="kicker">MÁS ALLÁ DEL CONCEPTO AISLADO</p><h2>Reconocimiento y dependencia</h2><p class="lead">La autoconciencia se relaciona con otras autoconciencias y con el trabajo.</p><div class="two"><div class="panel"><h3>SEÑORÍO</h3><p>Pretensión de independencia.</p></div><div class="panel"><h3>SERVIDUMBRE</h3><p>Trabajo y transformación del objeto.</p></div></div><div class="callout">El reconocimiento no es un atributo aislado: supone relaciones mediadas.</div>`,source:"Fenomenología del espíritu, Autoconciencia, aprox. §§178–196"},
{folio:"HEGEL / ERROR COMÚN",title:"¿Tesis → antítesis → síntesis?",kind:"myth",body:`<p class="kicker">EL MITO MÁS PERSISTENTE</p><h2>¿Tesis → antítesis → síntesis?</h2><p class="lead">Una simplificación escolar no sustituye el examen textual.</p><div class="flow4" style="grid-template-columns:1fr auto 1fr auto 1fr"><article><h3>TESIS</h3></article><div style="align-self:center;font-size:2.3rem;color:var(--red)">→</div><article><h3>ANTÍTESIS</h3></article><div style="align-self:center;font-size:2.3rem;color:var(--red)">→</div><article><h3>SÍNTESIS</h3></article></div><div class="callout">Hegel no adoptó esta tríada como regla universal de su filosofía. LA TRANSICIÓN DEBE DEMOSTRARSE, NO IMPONERSE.</div>`,source:"Informe, pp. 7, 16; Enciclopedia §§79–82"},
{folio:"03 / MARX",title:"Marx",kind:"section marx",body:`<div class="section marx"><div><div class="index">ESTUDIO COMPARATIVO / 03</div><h2>Marx</h2><p>La dialéctica estudia relaciones sociales históricas: mercancía, valor, trabajo, capital y praxis.</p><div class="small">Crítica de la economía política</div></div></div>`},
{folio:"MARX / RELACIÓN CON HEGEL",title:"Una apropiación crítica de Hegel",kind:"relation",body:`<p class="kicker">NO ES CAMBIAR “IDEA” POR “MATERIA”</p><h2>Una apropiación crítica de Hegel</h2><div class="relation"><article><h3>Marx conserva</h3><ul><li>Crítica inmanente.</li><li>Relaciones, mediaciones, proceso.</li><li>Atención a contradicciones concretas.</li></ul></article><article><h3>Marx reformula</h3><p>El pensamiento reconstruye formas sociales reales; no engendra por sí solo el objeto histórico.</p></article></div><div class="callout">La “inversión” de Hegel designa una transformación metodológica, no un intercambio de sustancias.</div>`,source:"El capital I, epílogo a 2.ª ed. alemana (1873)"},
{folio:"MARX / EL CAPITAL",title:"Dos determinaciones de una forma social",kind:"commodity",body:`<p class="kicker">LA MERCANCÍA NO ES ALGO SIMPLE</p><h2>Dos determinaciones de una forma social</h2><div class="commodity"><div><strong>VALOR DE USO</strong><p>Utilidad cualitativa</p></div><div><strong>VALOR</strong><p>Forma social del trabajo</p></div></div><div class="callout">La doble determinación abre el análisis de la forma de valor y el dinero.</div>`,source:"El capital, tomo I, capítulo 1"},
{folio:"MARX / MÉTODO",title:"Cómo se reconstruye una totalidad",kind:"flow4",body:`<p class="kicker">DE LO ABSTRACTO A LO CONCRETO</p><h2>Cómo se reconstruye una totalidad</h2><div class="flow4"><article><b>01</b><h3>Investigación</h3><p>Realidad histórica compleja.</p></article><article><b>02</b><h3>Abstracción</h3><p>Determinar relaciones.</p></article><article><b>03</b><h3>Exposición</h3><p>Reconstruir conexiones.</p></article><article><b>04</b><h3>Concreto pensado</h3><p>Unidad de determinaciones.</p></article></div><div class="callout">El orden de la exposición no es la cronología real de origen de las cosas.</div>`,source:"Grundrisse, Introducción (1857), §3"},
{folio:"MARX / HISTORIA",title:"Fuerzas productivas y relaciones de producción",kind:"two",body:`<p class="kicker">LAS CONTRADICCIONES SON HISTÓRICAS</p><h2>Fuerzas productivas y relaciones de producción</h2><div class="two"><div class="panel"><h3>FUERZAS PRODUCTIVAS</h3><p>Capacidades materiales y sociales de producir.</p></div><div class="panel"><h3>RELACIONES DE PRODUCCIÓN</h3><p>Propiedad, organización y relaciones sociales.</p></div></div><div class="callout">La tensión puede convertirse en conflicto histórico, político e ideológico.</div>`,source:"Contribución a la crítica de la economía política, Prefacio (1859)"},
{folio:"MARX / TESIS SOBRE FEUERBACH",title:"Conocer, actuar y transformar",kind:"praxis",body:`<p class="kicker">PRAXIS</p><h2>Conocer, actuar y transformar</h2><p class="lead">Crítica de un materialismo que solo contempla la realidad.</p><div class="praxis"><div><h3>CONOCER</h3><p>Reconstruir cómo funciona una relación social.</p></div><div><h3>ACTUAR</h3><p>Intervenir mediante actividad humana situada.</p></div><div><h3>TRANSFORMAR</h3><p>Cambiar condiciones e instituciones.</p></div></div>`,source:"Tesis sobre Feuerbach, II y XI; informe, p. 12"},
{folio:"MARX / POSTERIDAD",title:"Marx no es idéntico a Engels",kind:"two",body:`<p class="kicker">UNA DISTINCIÓN INDISPENSABLE</p><h2>Marx no es idéntico a Engels</h2><div class="two"><div class="panel"><h3>Marx</h3><p>Dialéctica en la crítica de formas sociales capitalistas y análisis histórico-social de relaciones reales.</p></div><div class="panel"><h3>Engels</h3><p>Extiende la dialéctica a la naturaleza, la historia y el pensamiento en una sistematización general.</p></div></div><div class="callout">Las “tres leyes universales” no son un sistema que Marx dejara redactado como tratado.</div>`,source:"Informe, pp. 1, 12–13, 19"},
{folio:"COMPARACIÓN / PRECISIÓN",title:"Tres funciones de la negatividad",kind:"negcards",body:`<p class="kicker">NO TODA CONTRADICCIÓN SIGNIFICA LO MISMO</p><h2>Tres funciones de la negatividad</h2><div class="negcards"><article><small>SÓCRATES</small><h3>Incompatibilidad</h3><p>P y otros compromisos asumidos no se sostienen a la vez.</p></article><article><small>HEGEL</small><h3>Autolímite conceptual</h3><p>Una determinación unilateral revela su insuficiencia inmanente.</p></article><article><small>MARX</small><h3>Antagonismo social</h3><p>Relaciones históricas generan tensiones estructurales y lucha.</p></article></div>`,source:"Informe, pp. 2, 15–16"},
{folio:"COMPARACIÓN / MATRIZ",title:"Misma familia de problemas, distintos métodos",kind:"matrix",body:`<p class="kicker">CUADRO COMPARATIVO</p><h2>Misma familia de problemas, distintos métodos</h2><div class="matrix"><div class="head">Dimensión</div><div class="head">Sócrates / Platón</div><div class="head">Hegel</div><div class="head">Marx</div><div class="label">Objeto</div><div>Creencias / principios</div><div>Determinaciones</div><div>Formas sociales</div><div class="label">Método</div><div>Pregunta / hipótesis</div><div>Crítica inmanente</div><div>Investigación histórica</div><div class="label">Negación</div><div>Refutación</div><div>Negación determinada</div><div>Antagonismos</div><div class="label">Finalidad</div><div>Conocimiento</div><div>Concreto conceptual</div><div>Crítica y praxis</div></div>`,source:"Informe, pp. 14–17"},
{folio:"APLICACIÓN PEDAGÓGICA",title:"Una misma cuestión: ¿qué es la justicia?",kind:"application",body:`<p class="kicker">PONGAMOS A PRUEBA LAS TRES LENTES</p><h2>Una misma cuestión: ¿qué es la justicia?</h2><p class="lead">Ejemplo de aplicación construido para la exposición; no es cita de los autores.</p><div class="application"><div><strong>Sócrates / Platón</strong><span>¿Qué definimos como justo? ¿La respuesta resiste los contraejemplos?</span></div><div><strong>Hegel</strong><span>¿Qué límites tiene una libertad solo abstracta? ¿Cómo se realiza institucionalmente?</span></div><div><strong>Marx</strong><span>¿Qué relaciones sociales producen desigualdad y cómo podrían cambiar?</span></div></div>`,source:"Ejemplo editorial inspirado en el informe, pp. 15–17"},
{folio:"DEBATES CONTEMPORÁNEOS",title:"Límites y objeciones",kind:"triptych",body:`<p class="kicker">LO QUE DEBE DISCUTIRSE, NO MEMORIZARSE</p><h2>Límites y objeciones</h2><div class="triptych"><article><h3>Sócrates / Platón</h3><p>¿La refutación establece conocimiento? Problema de premisas compartidas y elitismo político.</p></article><article><h3>Hegel</h3><p>¿Qué cuenta como contradicción? ¿Cada transición es verdaderamente inmanente?</p></article><article><h3>Marx</h3><p>Evitar determinismo, dogmatismo y explicaciones sin mecanismos causales verificables.</p></article></div><div class="callout">Una buena dialéctica debe explicar sus transiciones; no basta invocar “contradicciones”.</div>`,source:"Informe, pp. 5, 9, 13–14"},
{folio:"CONCLUSIÓN",title:"Preguntar. Desarrollar. Transformar.",kind:"conclusion",body:`<div class="questions"><div><p>UNA CONCLUSIÓN PARA RECORDAR</p><h2>Preguntar.<br>Desarrollar.<br>Transformar.</h2><div class="callout">Lo que cambia es dónde se sitúa el movimiento dialéctico.</div></div></div>`,source:"Síntesis académica; informe, p. 20"},
{folio:"BIBLIOGRAFÍA",title:"Fuentes primarias",kind:"biblio",body:`<p class="kicker">PARA CITAR LAS OBRAS</p><h2>Fuentes primarias</h2><div class="biblio"><div><strong>PLATÓN</strong><span><em>Eutifrón</em> 5d–6e, 9e–11b; <em>Menón</em> 86e–89c; <em>República</em> VI–VII (509d–511e, 531d–535a); <em>Fedro</em> 265d–266b; <em>Sofista</em> 253b–e.</span></div><div><strong>HEGEL</strong><span><em>Fenomenología del espíritu</em> (Introducción y Autoconciencia); <em>Ciencia de la lógica</em> (Ser–Nada–Devenir); <em>Enciclopedia</em> §§79–82.</span></div><div><strong>MARX</strong><span><em>Tesis sobre Feuerbach</em>, II y XI; <em>Grundrisse</em>, Introducción §3 (1857); Prefacio de 1859; <em>El capital</em>, tomo I, cap. 1 y epílogo de 1873.</span></div></div>`,source:"Fuentes primarias reunidas del PDF, pp. 18–20"},
{folio:"BIBLIOGRAFÍA",title:"Interpretaciones y debates",kind:"biblio",body:`<p class="kicker">PARA SEGUIR INVESTIGANDO</p><h2>Interpretaciones y debates</h2><div class="biblio"><div><strong>Sócrates / Platón</strong><span>Gregory Vlastos (1983, 1994); Richard Robinson (1953); Kenneth Sayre (1969).</span></div><div><strong>Hegel</strong><span>Stephen Houlgate (2006); Robert Pippin (1989); Terry Pinkard (1994); Karin de Boer (2010).</span></div><div><strong>Marx</strong><span>Georg Lukács (1923); Evald Ilyenkov (1960); Louis Althusser (1965); Christopher J. Arthur (1998); Jon Elster (1985).</span></div></div>`,source:"Bibliografía seleccionada del informe, pp. 18–20"},
{folio:"PREGUNTAS",title:"¿Cómo piensa cada dialéctica el cambio?",kind:"questions",body:`<div class="questions"><div><h2>¿Cómo piensa<br>cada dialéctica<br>el cambio?</h2><p>PREGUNTAS Y DISCUSIÓN</p><div class="small">Lectura principal: «Dialéctica: de Sócrates y Platón a Hegel y Marx», 23 pp.</div></div></div>`}
];
const stage=document.getElementById('stage'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next'),indexPanel=document.getElementById('indexPanel'),indexGrid=document.getElementById('indexGrid'),indexBtn=document.getElementById('indexBtn');
let current=Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.replace('#slide-',''),10)||1)-1));
function render(){
  stage.innerHTML=slides.map((s,i)=>`<section class="slide ${i===current?'active':''}" data-number="${String(i+1).padStart(2,'0')}" aria-label="Diapositiva ${i+1} de ${slides.length}: ${s.title}"><div class="brandline">PHILOSOPHIA / ARCHIVUM ACADEMICUM</div><div class="folio">${s.folio}</div>${s.body}${s.source?`<div class="source">${s.source}</div>`:''}</section>`).join('');
  counter.textContent=String(current+1).padStart(2,'0')+' / '+slides.length;
  prev.disabled=current===0; next.disabled=current===slides.length-1;
  document.querySelectorAll('.chapters button').forEach(b=>{const n=Number(b.dataset.go);const nextStart=[4,11,18,25,30,33].find(x=>x>n)??33;b.classList.toggle('on',current>=n&&current<nextStart)});
  history.replaceState(null,'','#slide-'+(current+1));
  document.title=slides[current].title+' · Dialéctica · PHILOSOPHIA';
}
function go(n){current=Math.max(0,Math.min(slides.length-1,n));render();closeIndex()}
function buildIndex(){indexGrid.innerHTML=slides.map((s,i)=>`<button type="button" data-index="${i}"><small>${String(i+1).padStart(2,'0')} · ${s.folio}</small>${s.title}</button>`).join('');indexGrid.addEventListener('click',e=>{const b=e.target.closest('button[data-index]');if(b)go(Number(b.dataset.index))})}
function openIndex(){indexPanel.classList.add('open');indexPanel.setAttribute('aria-hidden','false');indexBtn.setAttribute('aria-expanded','true')}
function closeIndex(){indexPanel.classList.remove('open');indexPanel.setAttribute('aria-hidden','true');indexBtn.setAttribute('aria-expanded','false')}
prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));indexBtn.addEventListener('click',()=>indexPanel.classList.contains('open')?closeIndex():openIndex());document.querySelectorAll('.chapters button').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go))));
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(slides.length-1)}if(e.key==='Escape')closeIndex()});
addEventListener('hashchange',()=>{const n=parseInt(location.hash.replace('#slide-',''),10);if(Number.isFinite(n)){current=Math.max(0,Math.min(slides.length-1,n-1));render()}});
buildIndex();render();
</script>
