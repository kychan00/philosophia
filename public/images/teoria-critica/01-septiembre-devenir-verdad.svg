<text x="48" y="400" font-family="Arial" font-size="10" fill="#5E554C">RECONSTRUCCION EDITORIAL PHILOSOPHIA - NO DIAGRAMA LITERAL DE LA PROFESORA - NO FORMULA UNIVERSAL DE HEGEL</text>
