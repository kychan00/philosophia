<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Verdad como proceso y movimiento dialectico</title>
<desc id="desc">Ilustracion original de PHILOSOPHIA. Una configuracion pasa por contradiccion y transformacion hasta una nueva forma. El resultado se comprende junto con el recorrido. No representa una formula universal de Hegel.</desc>
