<rect x="290" y="115" width="180" height="100" fill="#D7C2A5" stroke="#121212" stroke-width="3"/>
<text x="380" y="172" font-size="23" fill="#121212">contradiccion</text>
<rect x="525" y="115" width="180" height="100" fill="#2B2725" stroke="#121212" stroke-width="3"/>
<text x="615" y="172" font-size="23" fill="#FCF9F2">transformacion</text>
<rect x="760" y="115" width="180" height="100" fill="#FCF9F2" stroke="#9E1010" stroke-width="3"/>
<text x="850" y="172" font-size="23" fill="#121212">nueva forma</text>
</g>
