<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="660" viewBox="0 0 1320 660" role="img" aria-labelledby="title desc">
<title id="title">Freud: cultura, constitución del yo y principio de realidad</title>
<desc id="desc">A la izquierda una pregunta por los logros culturales y el bienestar del individuo. A la derecha un esquema docente de fusión, separación, frustración y reconocimiento de límites. Las flechas indican un itinerario pedagógico, no una ley psicológica universal.</desc>
<rect width="1320" height="660" fill="#FCF9F2"/><rect x="2" y="2" width="1316" height="656" fill="none" stroke="#121212" stroke-width="3"/><rect width="1320" height="15" fill="#9E1010"/>
<text x="48" y="53" fill="#9E1010" font-family="Arial" font-size="17" font-weight="700" letter-spacing="2">PHILOSOPHIA · FI265 · FOLIO 013 / 22 OCTUBRE 2026</text>
<text x="48" y="104" fill="#121212" font-family="Georgia,serif" font-size="39">Del malestar cultural a la formación del yo</text>
<rect x="45" y="144" width="430" height="355" fill="#F0E6DA" stroke="#9E1010" stroke-width="2"/>
<text x="71" y="181" font-family="Arial" font-size="13" font-weight="700" fill="#9E1010">PROBLEMA RECTOR · CULTURA</text>
<text x="260" y="246" font-family="Georgia,serif" font-size="27" fill="#121212" text-anchor="middle">Desarrollo cultural</text>
<text x="260" y="280" font-family="Arial" font-size="16" fill="#453D36" text-anchor="middle">arte · técnica · convivencia</text>
<path d="M260 308 v48" stroke="#9E1010" stroke-width="3"/><path d="M252 347 l8 14 8 -14" fill="none" stroke="#9E1010" stroke-width="2"/>
<text x="260" y="398" font-family="Georgia,serif" font-size="25" fill="#121212" text-anchor="middle">¿Bienestar individual?</text>
<text x="260" y="430" font-family="Arial" font-size="15" fill="#453D36" text-anchor="middle">La relación no está garantizada</text>
<text x="260" y="463" font-family="Arial" font-size="13" fill="#9E1010" text-anchor="middle">PREGUNTA · NO RESPUESTA CERRADA</text>
<rect x="514" y="144" width="760" height="355" fill="#F9F4EA" stroke="#121212" stroke-width="2"/>
<text x="541" y="181" font-family="Arial" font-size="13" font-weight="700" fill="#9E1010">SECUENCIA DOCENTE · DIFERENCIACIÓN YO / OTRO</text>
<g font-family="Georgia,serif" font-size="25" fill="#121212" text-anchor="middle">
<text x="628" y="271">Fusión</text><text x="825" y="271">Separación</text><text x="1021" y="271">Frustración</text><text x="1193" y="271">Realidad</text></g>
<g fill="#F0E6DA" stroke="#9E1010" stroke-width="2"><rect x="548" y="224" width="156" height="99" rx="5"/><rect x="746" y="224" width="158" height="99" rx="5"/><rect x="942" y="224" width="158" height="99" rx="5"/><rect x="1116" y="224" width="143" height="99" rx="5"/></g>
<g font-family="Georgia,serif" font-size="25" fill="#121212" text-anchor="middle">
<text x="626" y="271">Fusión</text><text x="825" y="271">Separación</text><text x="1021" y="271">Frustración</text><text x="1187" y="271">Realidad</text></g>
<g fill="none" stroke="#9E1010" stroke-width="3"><path d="M704 272 h40"/><path d="M904 272 h36"/><path d="M1100 272 h14"/></g>
<g fill="#9E1010"><path d="M733 265 l12 7 -12 7z"/><path d="M929 265 l12 7 -12 7z"/><path d="M1103 265 l12 7 -12 7z"/></g>
<g font-family="Arial" font-size="14" fill="#4E433B" text-anchor="middle"><text x="627" y="360">yo/otro difuso</text><text x="825" y="360">alteridad</text><text x="1021" y="360">límite al deseo</text><text x="1188" y="360">mundo propio</text></g>
<text x="898" y="421" font-family="Georgia,serif" font-size="24" fill="#121212" text-anchor="middle">Del principio del placer al principio de realidad</text>
<text x="898" y="455" font-family="Arial" font-size="14" fill="#55473F" text-anchor="middle">Ejemplo de clase · no cronología psicológica universal</text>
<path d="M475 322 h39" stroke="#9E1010" stroke-width="3" stroke-dasharray="8 6"/>
<text x="48" y="548" font-family="Arial" font-size="15" font-weight="700" fill="#9E1010">CÓMO LEERLO</text>
<text x="48" y="579" font-family="Arial" font-size="15" fill="#342B27">Flechas continuas = orden de explicación docente; línea discontinua = vínculo temático entre los dos bloques.</text>
<text x="48" y="606" font-family="Arial" font-size="15" fill="#342B27">No es una ley causal, un diagrama original de Freud ni una exposición completa de El malestar en la cultura.</text>
<text x="48" y="633" font-family="Arial" font-size="13" fill="#76675D">ILUSTRACIÓN ORIGINAL PHILOSOPHIA · ORIGINAL-OWNED · FUENTES DE LA CLASE SEPARADAS DE RECONSTRUCCIÓN EDITORIAL</text>
</svg>