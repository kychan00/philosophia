    <path d="M885 132v123" fill="none"/>
    <path d="M786 161q35-10 76 9M786 190q33-9 76 8M786 219q34-9 76 8M906 168q37-14 81-8M906 200q35-11 81-8" fill="none" stroke="#9E1010" stroke-width="3"/>
    <path d="M996 81l16 10-78 116-24 14 4-29z" fill="#D3AB79"/>
    <path d="M912 194l20 12" stroke="#121212" stroke-width="3"/>
  </g>
  <g fill="#9E1010">
    <circle cx="190" cy="285" r="4"/><circle cx="540" cy="285" r="4"/><circle cx="890" cy="285" r="4"/>
  </g>
</svg>
