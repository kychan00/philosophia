<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Del principio del placer al malestar cultural</title>
  <desc id="desc">Diagrama original con un recorrido desde deseo y principio del placer hacia límites del cuerpo, naturaleza y vínculos, y desde allí hacia estrategias culturales y elaboración analítica.</desc>
  <rect width="1200" height="720" rx="28" fill="#161616"/>
  <g fill="none" stroke="#f4f4f4" stroke-width="2" opacity=".72">
    <path d="M180 350 H360"/>
    <path d="M520 350 H690"/>
    <path d="M850 350 H1020"/>
    <path d="M770 280 V160"/>
    <path d="M770 420 V555"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="80" fill="#f4f4f4" font-size="28" font-weight="700">29 OCT 2026 · FREUD / MALESTAR</text>
    <text x="72" y="116" fill="#c6c6c6" font-size="17">Reconstrucción editorial · relaciones de estudio, no causalidad universal</text>

    <rect x="70" y="270" width="230" height="160" rx="18" fill="#8a3ffc"/>
    <text x="98" y="320" fill="#fff" font-size="18">DESEO</text>
    <text x="98" y="360" fill="#fff" font-size="30" font-weight="700">Principio</text>
    <text x="98" y="394" fill="#fff" font-size="30" font-weight="700">del placer</text>

    <rect x="360" y="270" width="240" height="160" rx="18" fill="#0f62fe"/>
    <text x="388" y="320" fill="#fff" font-size="18">REALIDAD</text>
    <text x="388" y="360" fill="#fff" font-size="30" font-weight="700">Frustración</text>
    <text x="388" y="394" fill="#fff" font-size="20">límite · falta</text>

    <rect x="690" y="270" width="320" height="160" rx="18" fill="#a2191f"/>
    <text x="718" y="314" fill="#fff" font-size="18">FUENTES DEL SUFRIMIENTO</text>
    <text x="718" y="354" fill="#fff" font-size="25" font-weight="700">cuerpo · naturaleza</text>
    <text x="718" y="389" fill="#fff" font-size="25" font-weight="700">vínculos humanos</text>

    <rect x="650" y="90" width="240" height="100" rx="16" fill="#198038"/>
    <text x="680" y="132" fill="#fff" font-size="17">ESTRATEGIAS</text>
    <text x="680" y="164" fill="#fff" font-size="21" font-weight="700">cultura · fuga · práctica</text>

    <rect x="650" y="525" width="240" height="105" rx="16" fill="#ba4e00"/>
    <text x="680" y="567" fill="#fff" font-size="17">ELABORACIÓN</text>
    <text x="680" y="599" fill="#fff" font-size="21" font-weight="700">transferencia · repetición</text>

    <text x="1028" y="344" fill="#f4f4f4" font-size="17">¿cómo vivir</text>
    <text x="1028" y="370" fill="#f4f4f4" font-size="17">con el límite?</text>
  </g>
</svg>
