<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Constelación de problemas que orientan la segunda clase de Teoría Crítica</title>
  <desc id="desc">Ilustración original de PHILOSOPHIA. Hegel, Marx, Lukács y Freud aparecen alrededor de Frankfurt como referencias de problemas históricos, sociales y psíquicos. Las líneas son conexiones de estudio y no una genealogía causal literal.</desc>
