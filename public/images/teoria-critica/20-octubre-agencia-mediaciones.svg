<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
<title id="title">Agencia y mediaciones sociales · Teoría Crítica, 20 de octubre</title>
<desc id="desc">Un bloque de trabajo humano se relaciona con instrumentos e instituciones; la pregunta por la agencia conecta tres campos: burocracia, inteligencia artificial y disciplina. Las líneas muestran campos de análisis y no causalidad automática. IA y Foucault corresponden a ampliaciones docentes, no a pasajes del texto de Lukács.</desc>
