  <text x="595" y="250" font-family="Arial" font-size="11" fill="#FCF9F2">la estructura creada parece adquirir</text>
  <text x="595" y="270" font-family="Arial" font-size="11" fill="#FCF9F2">autonomía y exigir adaptación</text>
