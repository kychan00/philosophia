<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
<title id="title">Cosificación: de la forma mercancía a la vida social</title>
<desc id="desc">Ilustración original de PHILOSOPHIA. A la izquierda un sujeto crea herramientas y procedimientos; en el centro una estructura cosificada parece invertir la relación y organizar al sujeto; a la derecha se abren cuatro campos de análisis de la sesión: fábrica, burocracia, afectos y responsabilidad. Las ramas indican expansión temática, no causalidad ni citas textuales de Lukács.</desc>
<rect width="1240" height="520" fill="#FCF9F2"/>
<rect x="1.5" y="1.5" width="1237" height="517" fill="none" stroke="#6B7151" stroke-width="3"/>
<rect width="1240" height="18" fill="#6B7151"/>
<text x="48" y="58" font-family="Arial" font-size="12" font-weight="700" fill="#6B7151">COSIFICACIÓN · FORMA MERCANCÍA Y VIDA SOCIAL · 15 OCT 2026</text>

