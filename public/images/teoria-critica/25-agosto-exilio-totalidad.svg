<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Exilio, investigación social y totalidad en la tercera clase de Teoría Crítica</title>
  <desc id="desc">Ilustración original de PHILOSOPHIA. A la izquierda aparece una ruta institucional desde Frankfurt hacia Ginebra, París, Nueva York y Los Ángeles; a la derecha, cinco dimensiones de la sociedad rodean el concepto de totalidad. La imagen organiza temas de estudio y no representa un mapa geográfico exacto ni una teoría causal.</desc>
  <rect x="1.5" y="1.5" width="1197" height="427" fill="#FCF9F2" stroke="#9E1010" stroke-width="3"/>
  <rect x="0" y="0" width="1200" height="18" fill="#9E1010"/>
