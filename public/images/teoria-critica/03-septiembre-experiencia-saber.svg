<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Experiencia, negatividad y superacion en la clase del 3 de septiembre</title>
<desc id="desc">Ilustracion original de PHILOSOPHIA. Una figura de conciencia formula una pretension de verdad, encuentra un desajuste en la experiencia y se transforma en una nueva figura mas determinada. A la derecha se distingue conocimiento especializado de saber como relacion de partes dentro de una totalidad. No es un diagrama literal de Hegel ni de la profesora.</desc>
