<title id="title">Totalidad social, reproducción y enajenación</title>
<desc id="desc">Ilustración original de PHILOSOPHIA. Totalidad social ocupa el centro y se conecta con materialidad, conciencia, trabajo reproductivo, división sexual del trabajo y los momentos producto/actividad de la enajenación. Las líneas indican articulación y mediación, no identidad ni causalidad automática.</desc>
