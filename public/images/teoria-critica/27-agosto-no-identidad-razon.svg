<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">No-identidad, contradicción y razón instrumental en la cuarta clase de Teoría Crítica</title>
  <desc id="desc">Ilustración original de PHILOSOPHIA. A la izquierda, un concepto no cubre por completo al objeto y deja un resto señalado como no-identidad. A la derecha, una pregunta por fines se distingue del cálculo eficiente de medios. Las relaciones son esquemas de estudio, no reproducciones de un diagrama de clase.</desc>
  <rect x="1.5" y="1.5" width="1197" height="427" fill="#FCF9F2" stroke="#9E1010" stroke-width="3"/>
  <rect x="0" y="0" width="1200" height="18" fill="#9E1010"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#9E1010" font-size="12" font-weight="700" letter-spacing="1.4">
    <text x="48" y="56">NO-IDENTIDAD / CONTRADICCIÓN / RAZÓN · 27 AGO 2026</text>
  </g>

  <g transform="translate(65 92)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5E554C" letter-spacing="1.2">I · CONCEPTO Y OBJETO</text>
    <rect x="0" y="32" width="250" height="190" rx="4" fill="#EEE4D7" stroke="#121212" stroke-width="3"/>
    <circle cx="162" cy="128" r="95" fill="#D7C2A5" stroke="#121212" stroke-width="3"/>
    <path d="M245 65 C290 80 294 172 253 192" fill="none" stroke="#9E1010" stroke-width="5" stroke-dasharray="8 7"/>
    <text x="78" y="117" font-family="Georgia, serif" font-size="26" fill="#121212">CONCEPTO</text>
    <text x="127" y="137" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5E554C">identifica / organiza</text>
    <text x="129" y="158" font-family="Georgia, serif" font-size="25" fill="#121212">OBJETO</text>
    <text x="269" y="128" font-family="Georgia, serif" font-size="18" fill="#9E1010">RESTO</text>
    <text x="269" y="151" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5E554C">no-identidad</text>
    <text x="0" y="254" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5E554C">EL CONCEPTO AYUDA A PENSAR · NO AGOTA EL OBJETO</text>
  </g>

  <line x1="600" y1="92" x2="600" y2="355" stroke="#BDB1A5" stroke-width="2"/>

  <g transform="translate(690 92)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#5E554C" letter-spacing="1.2">II · FINES Y MEDIOS</text>
    <rect x="0" y="40" width="190" height="110" fill="#2B2725" stroke="#121212" stroke-width="3"/>
    <rect x="250" y="40" width="190" height="110" fill="#EEE4D7" stroke="#121212" stroke-width="3"/>
    <path d="M192 95 H238" stroke="#9E1010" stroke-width="4"/>
    <path d="M228 84 L240 95 L228 106" fill="none" stroke="#9E1010" stroke-width="4"/>
    <text x="95" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#FCF9F2">PREGUNTA NORMATIVA</text>
    <text x="95" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#FCF9F2">¿qué fin?</text>
    <text x="95" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#FCF9F2">verdad · justicia · legitimidad</text>
    <text x="345" y="74" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9E1010">CÁLCULO INSTRUMENTAL</text>
    <text x="345" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#121212">¿qué medio?</text>
    <text x="345" y="131" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5E554C">eficiencia · utilidad · control</text>
    <rect x="78" y="190" width="286" height="72" fill="#D7C2A5" stroke="#121212" stroke-width="2"/>
    <text x="221" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#121212">CRÍTICA DE LA RAZÓN</text>
    <text x="221" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5E554C">NO REDUCIR RACIONALIDAD A EFICIENCIA</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#5E554C" font-size="10">
    <text x="48" y="397">RECONSTRUCCIÓN EDITORIAL PHILOSOPHIA · NO ESQUEMA LITERAL DE LA PROFESORA · LAS FLECHAS INDICAN LECTURA, NO NECESIDAD CAUSAL</text>
  </g>
</svg>