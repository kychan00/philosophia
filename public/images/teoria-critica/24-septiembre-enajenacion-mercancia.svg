<text x="48" y="458" font-family="Arial" font-size="10" fill="#5E554C">RECONSTRUCCIÓN EDITORIAL PHILOSOPHIA · RECORRIDO DE CLASE, NO IDENTIDAD ENTRE OBRAS · VALOR/PRECIO QUEDA ABIERTO</text>
</svg>