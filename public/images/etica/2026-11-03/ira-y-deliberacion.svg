<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 375" role="img" aria-labelledby="title desc"><title id="title">De la ofensa a la respuesta moral</title><desc id="desc">La confianza quebrantada puede suscitar dolor e ira. El deseo de castigo puede desembocar en daño; el examen de los afectos abre la posibilidad de deliberar.</desc><rect width="360" height="375" rx="12" fill="#f6f9ff"/><g stroke="#1a365d" stroke-width="1.6" fill="none"><path d="M180 59v19m0 43v19m0 43v23H89v19m91-19h91v19M89 272v20m182-20v20"/><path d="m176 73 4 5 4-5m-8 57 4 5 4-5m-99 90 4 5 4-5m174 0 4 5 4-5m-190 67 4 5 4-5m174-5 4 5 4-5"/></g><g stroke="#1a365d" stroke-width="1.2" fill="#e7eef9"><rect x="64" y="16" width="232" height="43" rx="8"/><rect x="64" y="78" width="232" height="43" rx="8"/><rect x="108" y="140" width="144" height="43" rx="8"/><rect x="12" y="225" width="154" height="47" rx="8"/><rect x="194" y="225" width="154" height="47" rx="8"/><rect x="12" y="292" width="154" height="60" rx="8"/><rect x="194" y="292" width="154" height="60" rx="8"/></g><g fill="#1a365d" font-family="system-ui,sans-serif" font-size="12" text-anchor="middle"><text x="180" y="34" font-weight="bold">Confianza y afecto</text><text x="180" y="48">Vínculo cercano</text><text x="180" y="96" font-weight="bold">Injusticia percibida</text><text x="180" y="110">Traición o ultraje</text><text x="180" y="166" font-weight="bold">Dolor e ira</text><text x="89" y="244" font-weight="bold">Deseo de castigar</text><text x="89" y="258">Venganza</text><text x="271" y="244" font-weight="bold">Examen del afecto</text><text x="271" y="258">Comprensión</text><text x="89" y="311" font-weight="bold">Riesgo de daño</text><text x="89" y="326">A sí y a otros</text><text x="89" y="340">Pérdida de control</text><text x="271" y="311" font-weight="bold">Deliberación</text><text x="271" y="326">Respuesta</text><text x="271" y="340">justificada</text></g></svg>