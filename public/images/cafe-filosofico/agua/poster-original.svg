<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
  <title id="title">Café Filosófico Interdisciplinario · Hablemos sobre el agua</title>
  <desc id="desc">Cartel promocional del encuentro del lunes 19 a la 1 P.M. en Edificio C, Aula 5.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c5574"/>
      <stop offset=".48" stop-color="#69c9dc"/>
      <stop offset="1" stop-color="#c6e4df"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b76d"/>
      <stop offset="1" stop-color="#b8733b"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b25"/>
      <stop offset=".14" stop-color="#fff8de"/>
      <stop offset=".32" stop-color="#77756d"/>
      <stop offset=".5" stop-color="#f9edc4"/>
      <stop offset=".72" stop-color="#4a4b47"/>
      <stop offset=".88" stop-color="#fff9df"/>
      <stop offset="1" stop-color="#6c6a61"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0d3340" flood-opacity=".28"/>
    </filter>
    <filter id="paper" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence baseFrequency=".8" numOctaves="2" seed="7" type="fractalNoise" result="noise"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <pattern id="speck" width="33" height="31" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="10" r="1" fill="#173644" opacity=".12"/>
      <circle cx="26" cy="21" r=".8" fill="#173644" opacity=".1"/>
    </pattern>
  </defs>

  <rect width="1024" height="1536" fill="url(#sky)"/>
  <rect width="1024" height="1536" fill="url(#speck)"/>

  <!-- upper torn paper -->
  <path d="M35 55 L82 38 142 44 200 31 260 48 324 36 392 45 458 29 522 44 590 32 655 47 720 34 788 46 850 33 933 48 970 76 959 250 918 270 841 260 768 273 695 258 620 273 548 259 466 277 394 258 315 272 239 258 165 270 95 254 45 230 Z" fill="#e8d0a0" filter="url(#shadow)"/>
  <text x="62" y="168" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" fill="#0e1110" letter-spacing="-3">CAFÉ FILOSÓFICO</text>
  <g transform="translate(184 183) rotate(-1)">
    <path d="M0 0 L640 0 654 18 647 66 628 79 22 79 0 61 Z" fill="#121513"/>
    <text x="38" y="56" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#f3e4c8" letter-spacing="6">INTERDISCIPLINARIO</text>
  </g>
  <g transform="translate(895 102)">
    <path d="M0 34 h70 v30 c0 36-17 54-35 54S0 100 0 64Z" fill="none" stroke="#111" stroke-width="9"/>
    <path d="M70 48 q35-2 35 22 q0 24-35 23" fill="none" stroke="#111" stroke-width="8"/>
    <path d="M18 128 h56" stroke="#111" stroke-width="8" stroke-linecap="round"/>
    <path d="M18 10 q-12-20 0-38 M42 8 q-11-22 1-40" fill="none" stroke="#111" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- cyan topic -->
  <path d="M146 302 L199 289 265 299 331 286 397 301 466 291 531 303 598 286 665 300 735 287 808 300 861 291 900 313 893 505 840 522 773 511 701 525 634 512 562 526 490 514 417 527 348 512 278 524 211 511 156 520 137 497 Z" fill="#8fd4e3" filter="url(#shadow)"/>
  <text x="212" y="390" font-family="Arial Black, Arial, sans-serif" font-size="55" font-weight="900" fill="#132633" letter-spacing="2">HABLEMOS SOBRE</text>
  <text x="204" y="492" font-family="Arial Black, Arial, sans-serif" font-size="112" font-weight="900" fill="#102430" letter-spacing="-4">EL AGUA</text>

  <!-- questions -->
  <g font-family="Arial, sans-serif" fill="#152934">
    <circle cx="65" cy="610" r="34" fill="none" stroke="#102430" stroke-width="6"/><text x="52" y="624" font-size="38" font-weight="800">1</text>
    <text x="111" y="600" font-size="27" font-weight="700"><tspan x="111" dy="0">¿El agua es un derecho,</tspan><tspan x="111" dy="34">un recurso, un servicio</tspan><tspan x="111" dy="34">o un bien común?</tspan></text>

    <circle cx="65" cy="731" r="34" fill="none" stroke="#102430" stroke-width="6"/><text x="52" y="745" font-size="38" font-weight="800">2</text>
    <text x="111" y="720" font-size="27" font-weight="700"><tspan x="111">¿El agua embotellada</tspan><tspan x="111" dy="34">es una necesidad real</tspan><tspan x="111" dy="34">o creada?</tspan></text>

    <circle cx="65" cy="856" r="34" fill="none" stroke="#102430" stroke-width="6"/><text x="52" y="870" font-size="38" font-weight="800">3</text>
    <text x="111" y="835" font-size="25" font-weight="700"><tspan x="111">¿Cómo se decide sobre</tspan><tspan x="111" dy="31">un daño que aparece</tspan><tspan x="111" dy="31">décadas después?</tspan><tspan x="111" dy="31">¿Quién se debería hacer</tspan><tspan x="111" dy="31">responsable de lo que</tspan><tspan x="111" dy="31">no se ve todavía?</tspan></text>
  </g>

  <!-- moderators paper -->
  <g transform="translate(735 545) rotate(-5)" filter="url(#shadow)">
    <path d="M0 0 L247 15 238 312 204 328 170 317 137 329 104 318 70 331 37 319 3 330 Z" fill="#efe8d9"/>
    <text x="35" y="68" font-family="Arial, sans-serif" font-size="40" font-style="italic" font-weight="700" fill="#161616">Moderan</text>
    <text x="40" y="114" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#202020">
      <tspan x="40">Kefren Martínez</tspan>
      <tspan x="40" dy="37">Mildred Solís</tspan>
      <tspan x="40" dy="37">Omar Villegas</tspan>
      <tspan x="40" dy="37">Diego Jimenez</tspan>
      <tspan x="40" dy="37">Cristian</tspan>
    </text>
  </g>

  <!-- desert -->
  <path d="M0 1035 Q180 995 365 1015 T710 1010 T1024 995 V1536 H0 Z" fill="url(#sand)"/>
  <path d="M0 1150 Q175 1110 352 1132 T690 1125 T1024 1110" fill="none" stroke="#a25d36" stroke-width="5" opacity=".5"/>
  <g stroke="#7c4b33" stroke-width="3" opacity=".45">
    <path d="M0 1250 L165 1227 292 1263 410 1231 574 1264 730 1238 886 1271 1024 1244"/>
    <path d="M114 1320 L210 1275 M210 1275 L272 1320 M416 1362 L501 1294 M501 1294 L575 1360 M745 1322 L820 1265 M820 1265 L904 1325"/>
  </g>

  <!-- faucet -->
  <g transform="translate(455 614)" filter="url(#shadow)">
    <ellipse cx="145" cy="52" rx="52" ry="60" fill="url(#chrome)" stroke="#171813" stroke-width="4"/>
    <rect x="123" y="100" width="44" height="65" rx="12" fill="url(#chrome)" stroke="#171813" stroke-width="4"/>
    <path d="M145 165 V430 H274 Q316 430 316 388 V338" fill="none" stroke="url(#chrome)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M145 165 V430 H274 Q316 430 316 388 V338" fill="none" stroke="#2c2e2b" stroke-opacity=".4" stroke-width="5"/>
    <rect x="110" y="402" width="72" height="42" rx="10" fill="url(#chrome)" stroke="#171813" stroke-width="4"/>
    <path d="M316 340 h76 q36 0 36 36 v52" fill="none" stroke="url(#chrome)" stroke-width="42" stroke-linecap="round"/>
    <path d="M411 410 q42-10 60 22 q18 35-4 63" fill="none" stroke="url(#chrome)" stroke-width="27" stroke-linecap="round"/>
    <path d="M145 442 V690" stroke="#d7f7ff" stroke-width="10" opacity=".85"/>
    <path d="M145 442 V690" stroke="#4eb8d0" stroke-width="4" opacity=".8"/>
  </g>

  <!-- pool -->
  <ellipse cx="600" cy="1325" rx="260" ry="105" fill="#2386a4" opacity=".92"/>
  <ellipse cx="600" cy="1325" rx="225" ry="72" fill="#70c9d9" opacity=".65"/>

  <!-- date paper -->
  <g transform="translate(42 1190) rotate(-4)" filter="url(#shadow)">
    <path d="M0 0 L356 12 350 278 315 286 278 277 238 289 199 280 158 290 118 279 77 289 35 278 0 286 Z" fill="#f0eadc"/>
    <text x="42" y="80" font-family="Arial, sans-serif" font-size="35" font-weight="800" fill="#111">Lunes 19</text>
    <text x="42" y="145" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#111">1:00 P.M.</text>
    <text x="42" y="210" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">Edificio C,</text>
    <text x="42" y="252" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">Aula 5</text>
  </g>

  <!-- coffee badge -->
  <g transform="translate(770 1320) rotate(-6)">
    <path d="M0 0 L230 10 225 151 203 164 174 157 144 168 112 158 78 166 45 158 12 164 Z" fill="#efb84b"/>
    <text x="54" y="72" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900" fill="#101512">CAFÉ</text>
    <text x="37" y="119" font-family="Arial Black, Arial, sans-serif" font-size="35" font-weight="900" fill="#101512">GRATIS</text>
  </g>
</svg>