<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
  <title id="title">Positivismo, cuatro reglas y crítica contemporánea</title>
  <desc id="desc">Diagrama vertical que conecta antecedentes modernos con Comte, cuatro reglas de Kołakowski y la pregunta por el poder científico y tecnológico.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#7a2d1e"/>
    </marker>
  </defs>
  <rect width="760" height="960" rx="28" fill="#efe4d1"/>
  <text x="380" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#38251d">Positivismo · 4 noviembre 2026</text>
  <text x="380" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="2" fill="#7a2d1e">ESQUEMA PEDAGÓGICO ORIGINAL · PHILOSOPHIA</text>

  <rect x="170" y="125" width="420" height="90" rx="18" fill="#fff9ed" stroke="#b99061" stroke-width="2"/>
  <text x="380" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="24" fill="#38251d">Hume · Kant · Descartes</text>
  <text x="380" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#694a38">experiencia · límites de la metafísica · dominio de la naturaleza</text>

  <line x1="380" y1="215" x2="380" y2="263" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="205" y="275" width="350" height="96" rx="22" fill="#6f2f24"/>
  <text x="380" y="314" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="#fff7e8">POSITIVISMO</text>
  <text x="380" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#f0d8b2">Comte · ciencia · hechos · progreso · anti-metafísica</text>

  <line x1="380" y1="371" x2="380" y2="416" stroke="#7a2d1e" stroke-width="3"/>
  <line x1="150" y1="416" x2="610" y2="416" stroke="#7a2d1e" stroke-width="3"/>
  <line x1="150" y1="416" x2="150" y2="452" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="310" y1="416" x2="310" y2="452" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="450" y1="416" x2="450" y2="452" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="610" y1="416" x2="610" y2="452" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="55" y="466" width="190" height="150" rx="18" fill="#fff9ed" stroke="#b99061" stroke-width="2"/>
  <text x="150" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7a2d1e">REGLA I</text>
  <text x="150" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#38251d">Fenomenalismo</text>
  <text x="150" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">fenómenos</text>
  <text x="150" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">sin esencias ocultas</text>

  <rect x="255" y="466" width="190" height="150" rx="18" fill="#fff9ed" stroke="#b99061" stroke-width="2"/>
  <text x="350" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7a2d1e">REGLA II</text>
  <text x="350" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#38251d">Nominalismo</text>
  <text x="350" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">conceptos generales</text>
  <text x="350" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">sin hipóstasis</text>

  <rect x="455" y="466" width="190" height="150" rx="18" fill="#fff9ed" stroke="#b99061" stroke-width="2"/>
  <text x="550" y="500" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7a2d1e">REGLA III</text>
  <text x="550" y="530" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#38251d">Juicios de valor</text>
  <text x="550" y="560" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">ciencia ≠ ética</text>
  <text x="550" y="585" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">problema normativo</text>

  <rect x="285" y="648" width="190" height="150" rx="18" fill="#fff9ed" stroke="#b99061" stroke-width="2"/>
  <text x="380" y="682" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7a2d1e">REGLA IV</text>
  <text x="380" y="712" text-anchor="middle" font-family="Georgia,serif" font-size="21" fill="#38251d">Unidad del método</text>
  <text x="380" y="742" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">ideal científico</text>
  <text x="380" y="767" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#694a38">común</text>

  <line x1="550" y1="616" x2="550" y2="690" stroke="#7a2d1e" stroke-width="2"/>
  <line x1="475" y1="723" x2="600" y2="723" stroke="#7a2d1e" stroke-width="2"/>
  <line x1="600" y1="723" x2="600" y2="822" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="380" y1="798" x2="380" y2="822" stroke="#7a2d1e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="150" y="836" width="460" height="86" rx="20" fill="#38251d"/>
  <text x="380" y="870" text-anchor="middle" font-family="Georgia,serif" font-size="23" fill="#fff7e8">Pregunta contemporánea</text>
  <text x="380" y="899" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#efd5ae">poder científico-técnico ≠ progreso moral automático</text>
</svg>